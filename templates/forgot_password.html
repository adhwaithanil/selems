<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SELEMS - Recover Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        html, body { 
            background-color: #000000 !important; 
            color: #ffffff !important; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
        }
        .recovery-card { 
            background-color: #0f172a;
            border: 1px solid #1e293b; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); 
            max-width: 450px; 
            width: 100%; 
        }
        .form-control, .input-group-text { 
            background-color: #020617 !important; 
            border-color: #334155 !important; 
            color: #ffffff !important; 
        }
        .form-control:focus { 
            border-color: #64748b !important; 
            box-shadow: 0 0 0 0.25rem rgba(100, 116, 139, 0.25); 
        }
        .form-control::placeholder { 
            color: #64748b !important; 
        }
        .btn-recover { 
            background-color: #ffffff;
            color: #000000;
            border: none;
            transition: all 0.3s ease; 
        }
        .btn-recover:hover { 
            background-color: #e2e8f0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container px-3">
        <div class="recovery-card p-5 rounded-5 mx-auto text-white">
            <div class="text-center mb-4">
                <span class="badge bg-dark border border-secondary text-light px-3 py-2 rounded-pill fw-semibold fs-7 mb-3">
                    <i class="fa-solid fa-key me-2"></i>Password Recovery
                </span>
                <h2 class="fw-bold text-white tracking-wide">Reset Password</h2>
                <p class="text-secondary small">Enter your registered email address to reset your credentials.</p>
            </div>

            <form method="POST">
                <div class="mb-4">
                    <label for="email" class="form-label text-secondary small fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text text-secondary"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="e.g. admin@selemslab.com" required>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-recover py-3 rounded-pill fw-semibold">
                        Reset Password <i class="fa-solid fa-paper-plane ms-2"></i>
                    </button>
                    <a href="{{ url_for('welcome') }}" class="btn btn-outline-light py-2 rounded-pill mt-2">
                        &larr; Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
