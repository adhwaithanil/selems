<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Equipment - SELEMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        html, body { 
            background-color: #000000 !important; 
            color: #ffffff !important; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .card { 
            background-color: #0f172a !important; 
            border: 1px solid #1e293b !important; 
            color: #ffffff !important; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); 
        }
        .form-control, .form-select { 
            background-color: #020617 !important; 
            border: 1px solid #334155 !important; 
            color: #ffffff !important; 
        }
        .form-control:focus, .form-select:focus { 
            background-color: #020617 !important; 
            border-color: #64748b !important; 
            color: #ffffff !important; 
            box-shadow: 0 0 0 0.25rem rgba(100, 116, 139, 0.25); 
        }
        .form-control::placeholder { 
            color: #64748b !important; 
        }
        .form-select option {
            background-color: #0f172a !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="py-5 text-white">
    <div class="container" style="max-width: 600px;">
        <div class="card p-4 rounded-4">
            <h3 class="fw-bold text-white mb-3">Add New Equipment</h3>
            <form method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold text-secondary">Equipment Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="category_id" class="form-label fw-semibold text-secondary">Category</label>
                    <select class="form-select" id="category_id" name="category_id" required>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="total_quantity" class="form-label fw-semibold text-secondary">Total Quantity</label>
                    <input type="number" class="form-control" id="total_quantity" name="total_quantity" min="1" required>
                </div>
                <div class="mb-3">
                    <label for="location" class="form-label fw-semibold text-secondary">Location / Bench</label>
                    <input type="text" class="form-control" id="location" name="location" placeholder="e.g., Bench A1" required>
                </div>
                <div class="mb-3">
                    <label for="condition" class="form-label fw-semibold text-secondary">Condition</label>
                    <select class="form-select" id="condition" name="condition">
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Needs Maintenance">Needs Maintenance</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('equipment_list') }}" class="btn btn-outline-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-light px-4 fw-semibold">Save Equipment</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
